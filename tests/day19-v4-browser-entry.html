<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAY19 V4 실제 게임 QA</title>
<style>body{font:18px system-ui;background:#181522;color:#fff;padding:40px}button{padding:16px;margin:8px}p{max-width:760px}</style>
<h1>DAY19 V4 실제 게임 QA</h1>
<p>검증된 DAY18 완료 상태에서 실제 DAY19 본선을 엽니다. 최초 실행 전에 모든 게임 저장 키를 세션에 한 번 백업하며 복원 버튼으로 되돌립니다.</p>
<button data-route="friendly">Friendly · 함께 여행 대화</button>
<button data-route="neutral">Neutral · 함께 여행 대화</button>
<button data-route="distant">Distant · 연락 휴식/혼자</button>
<button data-route="mixed">Mixed · 연락 가능/혼자/미완료 연락</button>
<button id="restore">테스트 전 저장 복원</button><p role="status" id="status"></p>
<script type="module">
import {createInitialState} from '../src/game-core.mjs';
import {createGirlfriendFromProfile} from '../src/girlfriend-manager.mjs';
import {SaveManager} from '../src/save-manager.mjs';
import {GAME_MODES} from '../src/scenario-state.mjs';
import {beginDay18V4,applyDay18V4Choice} from '../src/day18-v4-state-contract.mjs';
import {completeDay18V4GameChapter} from '../src/day18-v4-game-bridge.mjs?v=56';
const backupKey='day19-v4-qa-save-backup';
const keys=[SaveManager.key,SaveManager.keyForMode(GAME_MODES.MARRIAGE_30),SaveManager.keyForMode(GAME_MODES.FREE_ROMANCE)];
function backup(){if(sessionStorage.getItem(backupKey)===null)sessionStorage.setItem(backupKey,JSON.stringify(Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]))));}
function seed(route){const shared=['friendly','neutral'].includes(route),s=createInitialState(createGirlfriendFromProfile('haeun',()=>.5),()=>.5,{mode:GAME_MODES.MARRIAGE_30});s.day=18;s.phase=0;s.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};Object.assign(s.storyFlags,{day17V4Completed:true,day17V4Day18HookPending:true,day17V4TomorrowPlan:shared?'HAEUN':'SOLO',day17V4Choice9:shared?'day17_v4_life_haeun':'day17_v4_life_solo',day17V4DinnerAgreement:{day:18,partner:shared?'HAEUN':'SOLO',status:'ACCEPTED',sourceChoiceId:shared?'day17_v4_life_haeun':'day17_v4_life_solo'},day16V4YuriEncountered:false,day16V4YuriContact:'ENDED_HERE',day16V4YuriInvitation:'NONE'});beginDay18V4(s,shared?{}:{haeunContactAllowed:route!=='distant'});const day18Choices=shared?['morning_keep','disclose_together','menu_each','topic_good','close_home','night_good','calm_trip','travel_near']:route==='mixed'?['morning_solo','disclose_solo','menu_familiar','solo_food','return_home','night_defer','alone_stop','travel_life']:['morning_solo','menu_familiar','solo_food','return_home','alone_stop','travel_life'];for(const id of day18Choices)applyDay18V4Choice(s,`day18_v4_${id}`);completeDay18V4GameChapter(s,{type:'chapterCompletionCue',day:18,finalSceneReached:true});if(route==='mixed'){Object.assign(s.storyFlags,{day12V3PersonalInvitation:true,day12V3SeojinReply:'ACCEPTED_IN_PRINCIPLE',day19EntertainmentBudgetReserved:true});}s.day=19;s.phase=0;s.pendingStoryId='m30-day19-current-shared-chore';return s;}
document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{backup();SaveManager.save(seed(button.dataset.route));location.href='../index.html?qa=day19-v4';}));
document.querySelector('#restore').addEventListener('click',()=>{const data=sessionStorage.getItem(backupKey);if(data===null){document.querySelector('#status').textContent='이 탭에 백업이 없습니다.';return;}for(const [key,value] of Object.entries(JSON.parse(data)))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector('#status').textContent='테스트 전 저장을 복원했습니다.';});
</script></html>
