<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAY 17 V4 Actual UI QA Entry</title><style>body{font:16px system-ui;background:#151322;color:#fff;display:grid;min-height:100vh;place-items:center;margin:0}main{max-width:680px;padding:28px;background:#242033;border-radius:18px}.actions{display:grid;gap:12px}button{padding:14px 20px;border:0;border-radius:10px;background:#df5f91;color:#fff;font-weight:800}</style></head>
<body><main><h1>DAY 17 V4 실제 UI QA</h1><p>DAY 16 V4 완료 직후 저장을 만들어 제품 진입점으로 이동합니다.</p><div class="actions"><button data-route="meeting" type="button">하은 대면·유리 초대 경로</button><button data-route="solo" type="button">혼자 휴식·유리 미초대 경로</button><button data-restore type="button">QA 전 사용자 저장 복원</button></div><p id="status" role="status"></p></main>
<script type="module">
import {createInitialState} from "../src/game-core.mjs";import {createGirlfriendFromProfile} from "../src/girlfriend-manager.mjs";import {SaveManager} from "../src/save-manager.mjs";import {GAME_MODES} from "../src/scenario-state.mjs";
const makeState=route=>{const state=createInitialState(createGirlfriendFromProfile("haeun",()=>.5),()=>.5,{mode:GAME_MODES.MARRIAGE_30});state.day=17;state.phase=0;state.affection=720;state.trust=620;state.pendingStoryId="m30-day17-current-health-routine";state.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};state.storyHistory.push({day:16,sceneId:"m30-day16-current-social-circle",choiceId:"day16_v4_qa_complete",response:"DAY 16 V4 QA 완료"});Object.assign(state.storyFlags,{day16V4Version:"NOTION_V4",day16V4Completed:true,day16V4Day17BodyHookPending:true,day16V4YuriEncountered:route==="meeting",day16V4YuriContact:route==="meeting"?"SHARED":"NOT_APPLICABLE",day16V4YuriInvitation:route==="meeting"?"ANSWER_TOMORROW":"NONE",day16V4HaeunYuriKnowledge:route==="meeting"?"LIMITED_CONVERSATION":"UNKNOWN"});return state;};
const backupKey="day17-v4-qa-local-storage";
const captureUserSave=()=>{if(sessionStorage.getItem(backupKey)==null)sessionStorage.setItem(backupKey,JSON.stringify([...Array(localStorage.length)].map((_,index)=>{const key=localStorage.key(index);return [key,localStorage.getItem(key)];})));};
document.querySelectorAll("[data-route]").forEach(button=>button.addEventListener("click",()=>{captureUserSave();SaveManager.save(makeState(button.dataset.route));document.querySelector("#status").textContent="저장 준비 완료";location.href="../index.html?qa=day17-v4&route="+button.dataset.route;}));
document.querySelector("[data-restore]").addEventListener("click",()=>{const raw=sessionStorage.getItem(backupKey);if(raw==null){document.querySelector("#status").textContent="복원할 QA 백업이 없습니다.";return;}localStorage.clear();for(const [key,value] of JSON.parse(raw))localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector("#status").textContent="QA 전 사용자 저장을 복원했습니다.";});
</script></body></html>
