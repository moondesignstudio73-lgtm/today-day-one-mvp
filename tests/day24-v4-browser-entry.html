<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAY24 V4 실제 게임 QA</title>
<style>body{font:18px system-ui;background:#181522;color:#fff;padding:40px}button{padding:16px;margin:8px}p{max-width:900px;line-height:1.6}</style>
<h1>DAY24 V4 실제 게임 QA</h1>
<p>검증된 DAY22 완료 fixture에서 DAY23과 DAY24 실제 Story를 연속으로 엽니다. SKIP 없이 진행하고 종료 후 저장 상태를 검사합니다.</p>
<button id="friendly">Friendly · 대면 · 지속</button>
<button id="inspect">현재 QA 상태 확인</button>
<button id="restore">테스트 전 저장 복원</button>
<p role="status" id="status"></p>
<script>
document.querySelector('#friendly').addEventListener('click',()=>{location.href='./day23-v4-browser-entry.html?day24-followup=1';});
document.querySelector('#inspect').addEventListener('click',()=>{const raw=localStorage.getItem('today-day-one.save.v1.story'),saved=raw?JSON.parse(raw):null,chapter=saved?.storyFlags?.day24V4,error=saved?.eventRuntime?.lastError;document.querySelector('#status').textContent=JSON.stringify({error:error??null,phase:chapter?.phase??null,complete:chapter?.complete??false,conversation:chapter?.facts?.conversationMode??null,relationship:chapter?.facts?.haeunRelationshipOutcome??null,futureAccepted:chapter?.facts?.futureTalkAccepted??false,day25Route:chapter?.facts?.day25Route??null,day:saved?.day??null,pendingStoryId:saved?.pendingStoryId??null,day25Hook:saved?.storyFlags?.day24V4Day25HookPending??false,freeAction:saved?.storyFreeAction??null});});
document.querySelector('#restore').addEventListener('click',()=>{const backupKey=['day24-v4-qa-save-backup','day23-v4-qa-save-backup'].find(key=>sessionStorage.getItem(key)!==null);if(!backupKey){document.querySelector('#status').textContent='이 탭에 QA 백업이 없습니다.';return;}for(const [key,value] of Object.entries(JSON.parse(sessionStorage.getItem(backupKey))))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector('#status').textContent='테스트 전 저장을 복원했습니다.';});
document.querySelector('#status').textContent='DAY23 연속 플레이 fixture를 통해 DAY24를 검증합니다.';
</script></html>
