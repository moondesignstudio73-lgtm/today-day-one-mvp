<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAY28 V4 실제 게임 QA</title>
<style>body{font:18px system-ui;background:#181522;color:#fff;padding:40px}button{padding:16px;margin:8px}p{max-width:900px;line-height:1.6}</style>
<h1>DAY28 V4 실제 게임 QA</h1>
<p>검증된 DAY25~27 이력에서 DAY28 실제 Story를 엽니다. 본편은 AUTO OFF·SKIP 미사용으로 진행하며, 최초 실행 전 사용자 저장 세 슬롯을 이 탭 세션에 한 번만 백업합니다.</p>
<button data-route="friendly">Friendly · 하은 대면·관계 지속</button>
<button data-route="neutral">Neutral · 하은 짧은 통화</button>
<button data-route="distant">Distant · 만남 없는 혼자 하루</button>
<button data-route="mixed">Mixed · 아라 새 만남</button>
<button id="inspect">현재 QA 상태 확인</button>
<button id="restore">테스트 전 저장 복원</button>
<p role="status" id="status"></p>
<script>function reportQaModuleError(message){sessionStorage.setItem('day28-v4-qa-module-error',message);document.querySelector('#status').textContent=`QA 모듈 실패: ${message}`;}window.addEventListener('error',event=>reportQaModuleError(event.message));window.addEventListener('unhandledrejection',event=>reportQaModuleError(String(event.reason?.message??event.reason)));</script>
<script type="module">
import {SaveManager} from '../src/save-manager.mjs';
import {GAME_MODES} from '../src/scenario-state.mjs';
import {createInitialState} from '../src/game-core.mjs';
import {createGirlfriendFromProfile} from '../src/girlfriend-manager.mjs';
import {day28CallFixture,day28FriendlyFixture,day28NewMeetingFixture,day28SoloFixture} from './day28-v4-playable-fixture.mjs';

const backupKey='day28-v4-qa-save-backup';
const keys=[SaveManager.key,SaveManager.keyForMode(GAME_MODES.MARRIAGE_30),SaveManager.keyForMode(GAME_MODES.FREE_ROMANCE)];
function backup(){if(sessionStorage.getItem(backupKey)===null)sessionStorage.setItem(backupKey,JSON.stringify(Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]))));}
function seed(route){const fixtures={friendly:day28FriendlyFixture,neutral:day28CallFixture,distant:day28SoloFixture,mixed:day28NewMeetingFixture},fixture=fixtures[route](),state=createInitialState(createGirlfriendFromProfile('haeun',()=>.5),()=>.5,{mode:GAME_MODES.MARRIAGE_30}),scenario=state.scenario;Object.assign(state,fixture);state.gameMode=GAME_MODES.MARRIAGE_30;state.scenario={...scenario,...fixture.scenario,enabled:true};state.day=28;state.phase=0;state.pendingStoryId='m30-day28-current-ceremony-rehearsal';state.settings??={};state.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};return state;}
document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{try{backup();const route=button.dataset.route;SaveManager.save(seed(route));location.href=`../index.html?qa=day28-v4&route=${route}`;}catch(error){document.querySelector('#status').textContent=`QA 준비 실패: ${error?.message??error}`;}}));
document.querySelector('#inspect').addEventListener('click',()=>{const raw=localStorage.getItem(SaveManager.keyForMode(GAME_MODES.MARRIAGE_30)),saved=raw?JSON.parse(raw):null,chapter=saved?.storyFlags?.day28V4;document.querySelector('#status').textContent=JSON.stringify({error:saved?.eventRuntime?.lastError??null,phase:chapter?.phase??null,complete:chapter?.complete??false,route:chapter?.facts?.route??null,meetingMethod:chapter?.facts?.meetingMethod??null,relationshipResponse:chapter?.facts?.relationshipResponse??null,currentContact:chapter?.facts?.currentContact??null,homeInvitationResponse:chapter?.facts?.homeInvitationResponse??null,nextMeetingResponse:chapter?.facts?.nextMeetingResponse??null,newMeetingTarget:chapter?.input?.newMeeting?.recipient??null,newRelationshipResponse:chapter?.facts?.newRelationshipResponse??null,day:saved?.day??null,pendingStoryId:saved?.pendingStoryId??null,day29Hook:saved?.storyFlags?.day28V4Day29HookPending??false,freeAction:saved?.storyFreeAction??null});});
document.querySelector('#restore').addEventListener('click',()=>{const data=sessionStorage.getItem(backupKey);if(data===null){document.querySelector('#status').textContent='이 탭에 QA 백업이 없습니다.';return;}for(const [key,value] of Object.entries(JSON.parse(data)))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector('#status').textContent='테스트 전 저장을 복원했습니다.';});
document.querySelector('#status').textContent='DAY28 검증 경로를 선택하세요.';
</script></html>
