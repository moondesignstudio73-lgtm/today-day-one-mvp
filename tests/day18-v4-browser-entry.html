<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAY18 V4 실제 게임 QA</title>
<style>body{font:18px system-ui;background:#181522;color:#fff;padding:40px}button{padding:16px;margin:8px}p{max-width:760px}</style>
<h1>DAY18 V4 실제 게임 QA</h1>
<p>테스트용 DAY17 완료 상태로 실제 게임을 엽니다. 기존 저장은 이 탭의 세션에 백업되며 복원 버튼으로 되돌릴 수 있습니다. 전체 NEW GAME 통과 검증을 대신하지 않습니다.</p>
<button data-route="YURI">유리와 저녁</button><button data-route="HAEUN">하은과 저녁</button><button data-route="SOLO">혼자 저녁</button>
<button data-route="YURI" data-night-call="true">밤 통화 집중 QA (연락 가능)</button>
<button data-route="HAEUN" data-night-deferred="true">밤 대화 연기 집중 QA</button>
<button data-route="YURI" data-yuri-deferred="true">유리 저녁 미고지 통화 연기 QA</button>
<button data-route="SOLO" data-travel-photo="true">여행 사진 집중 QA</button>
<button data-route="YURI" data-wallet="true">지갑 행동 집중 QA</button>
<button data-route="YURI" data-arrival="true">유리 도착 전 메뉴 QA</button>
<button data-route="YURI" data-yuri-water="true">유리 단위 실수 물 QA</button>
<button data-route="HAEUN" data-haeun-arrival="true">하은 도착 가방 QA</button>
<button data-route="SOLO" data-solo-arrival="true">혼자 도착 가방 QA</button>
<button data-route="HAEUN" data-food-sharing="true">음식 나누기 집중 QA</button>
<button data-route="HAEUN" data-food-sharing="menu_each">음식 나누기 각자 메뉴 QA</button>
<button data-route="HAEUN" data-food-sharing="menu_wait">음식 나누기 메뉴 고민 QA</button>
<button data-route="YURI" data-meal-direction="true">유리 식사 행동 텍스트 QA</button>
<button data-route="YURI" data-table-space="true">추가 접시 자리 만들기 QA</button>
<button data-route="HAEUN" data-shoulder="true">옆자리 어깨 연출 QA</button>
<p><label><input id="no-contact" type="checkbox">하은 연락 휴식 (유리/혼자 경로)</label>
<label><input id="other-interest" type="checkbox">서진에게 실제 관심을 표현한 이력</label>
<label><input id="unknown-appointment" type="checkbox">하은에게 유리 약속을 아직 말하지 않음</label></p>
<button id="restore">테스트 전 저장 복원</button><p role="status" id="status"></p>
<script type="module">
import {createInitialState} from '../src/game-core.mjs';
import {createGirlfriendFromProfile} from '../src/girlfriend-manager.mjs';
import {SaveManager} from '../src/save-manager.mjs';
import {GAME_MODES} from '../src/scenario-state.mjs';
import {prepareDay18V4GameEntry,applyDay18V4GameChoice} from '../src/day18-v4-game-bridge.mjs?v=39';
const backupKey = 'day18-v4-qa-save-backup';
const keys = [SaveManager.key, SaveManager.keyForMode(GAME_MODES.MARRIAGE_30)];
document.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => {
  if (sessionStorage.getItem(backupKey) === null) sessionStorage.setItem(backupKey, JSON.stringify(Object.fromEntries(keys.map(k => [k, localStorage.getItem(k)]))));
  const partner = button.dataset.route;
  const s = createInitialState(createGirlfriendFromProfile('haeun', () => .5), () => .5, {mode: GAME_MODES.MARRIAGE_30});
  s.day = 18; s.phase = 0; s.pendingStoryId = 'm30-day18-current-home-safety';
  s.settings.guideCompleted = {main:true, atlas:true, district:true, room:true, map:true};
  s.storyHistory.push({day:17,sceneId:'m30-day17-current-health-routine',choiceId:'day17-v4-qa',response:'DAY17 입력 fixture'});
  Object.assign(s.storyFlags, {day17V4Completed:true, day17V4Day18HookPending:true,
    day17V4TomorrowPlan:partner === 'YURI' ? 'YURI_MEET' : partner,
    day17V4Choice9:partner === 'YURI' ? 'day17_v4_yuri_short' : partner === 'HAEUN' ? 'day17_v4_life_haeun' : 'day17_v4_life_solo',
    day17V4DinnerAgreement:{day:18,partner,status:'ACCEPTED',sourceChoiceId:'day17_v4_life_haeun'},
    day16V4YuriEncountered:partner === 'YURI',day16V4YuriContact:partner === 'YURI' ? 'SHARED' : 'ENDED_HERE',
    day16V4YuriInvitation:partner === 'YURI' ? 'ANSWER_TOMORROW' : 'NONE',
    day16V4HaeunRelationshipDisclosure:'NAMED_GIRLFRIEND',day17V4HaeunDisclosure:'TOLD'});
  s.storyFlags.day17V4HaeunContactPaused = partner !== 'HAEUN' && document.querySelector('#no-contact').checked;
  if (document.querySelector('#other-interest').checked) s.storyFlags.day12V3SeojinIntent = 'SPARK';
  if (document.querySelector('#unknown-appointment').checked) s.storyFlags.day17V4HaeunDisclosure = 'WITHHELD';
  if(button.dataset.nightCall) {
    s.storyFlags.day17V4HaeunContactPaused=false;
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_yuri','menu_each','purpose_present','apology_thanks','relationship_haeun','next_time','pay_split','night_tell']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.nightDeferred) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_together','menu_each','topic_good','close_home','night_thought']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.yuriDeferred) {
    s.storyFlags.day17V4HaeunDisclosure='WITHHELD';
    s.storyFlags.day17V4HaeunContactPaused=false;
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_withhold','menu_each','purpose_present','apology_thanks','relationship_haeun','next_ask','pay_split','night_tell']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.travelPhoto) {
    s.storyFlags.day17V4HaeunContactPaused=true;
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_solo','menu_familiar','solo_food','return_home','alone_stop']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.haeunArrival) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_together']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.soloArrival) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_solo','disclose_solo']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.arrival) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_yuri']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.yuriWater) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_yuri','menu_wait']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.wallet) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_yuri','menu_each','purpose_past','apology_thanks','relationship_haeun','next_time']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.foodSharing) {
    prepareDay18V4GameEntry(s);
    const menu=['menu_each','menu_wait'].includes(button.dataset.foodSharing) ? button.dataset.foodSharing : 'menu_share';
    for(const id of ['morning_keep','disclose_together',menu]) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.mealDirection) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_yuri','menu_each','purpose_present','apology_thanks']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.shoulder) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_together','menu_each','topic_good']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  if(button.dataset.tableSpace) {
    prepareDay18V4GameEntry(s);
    for(const id of ['morning_keep','disclose_yuri','menu_each','purpose_present','apology_thanks','relationship_haeun']) applyDay18V4GameChoice(s,`day18_v4_${id}`);
  }
  SaveManager.save(s); location.href = '../index.html?qa=day18-v4';
}));
document.querySelector('#restore').addEventListener('click', () => {
  const data = sessionStorage.getItem(backupKey);
  if (data === null) {document.querySelector('#status').textContent = '이 탭에 백업이 없습니다.'; return;}
  for (const [key, value] of Object.entries(JSON.parse(data))) value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value);
  sessionStorage.removeItem(backupKey); document.querySelector('#status').textContent = '테스트 전 저장을 복원했습니다.';
});
</script></html>
