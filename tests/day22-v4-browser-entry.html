<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAY22 V4 실제 게임 QA</title>
<style>body{font:18px system-ui;background:#181522;color:#fff;padding:40px}button{padding:16px;margin:8px}p{max-width:900px;line-height:1.6}</style>
<h1>DAY22 V4 실제 게임 QA</h1>
<p>검증된 DAY18→21 production reducer와 bridge를 실제로 완주해 부산 공유 숙소·부산 별실·서울 당일·사진/접촉 거절·연락 가능/불가 미여행 DAY22 시작 상태를 만듭니다. DAY22 본편은 실제 게임 화면에서 SKIP 없이 선택합니다. 최초 실행 전 저장 키를 이 탭의 세션에 한 번 백업합니다.</p>
<button data-route="busan-shared">Friendly · 부산 공유 숙소</button>
<button data-route="busan-separate">Neutral · 부산 별실</button>
<button data-route="seoul-day">Mixed · 서울 당일</button>
<button data-route="seoul-photo-reject">Difficult · 서울 · 사진 거절</button>
<button data-route="busan-contact-reject">Friendly · 부산 공유 · 손잡기 거절</button>
<button data-route="no-travel-contact">Neutral · 미여행 · 연락 가능</button>
<button data-route="no-travel-unavailable">Distant · 미여행 · 연락 불가</button>
<button id="inspect">현재 QA 오류 확인</button>
<button id="restore">테스트 전 저장 복원</button>
<p role="status" id="status"></p>
<script type="module">
import {createInitialState} from '../src/game-core.mjs';
import {createGirlfriendFromProfile} from '../src/girlfriend-manager.mjs';
import {SaveManager} from '../src/save-manager.mjs';
import {GAME_MODES} from '../src/scenario-state.mjs';
import {beginDay18V4,applyDay18V4Choice} from '../src/day18-v4-state-contract.mjs';
import {completeDay18V4GameChapter} from '../src/day18-v4-game-bridge.mjs?v=62';
import {getDay19V4Options} from '../src/day19-v4-state-contract.mjs';
import {applyDay19V4GameChoice,completeDay19V4GameChapter,prepareDay19V4GameEntry} from '../src/day19-v4-game-bridge.mjs?v=4';
import {getDay20V4Options} from '../src/day20-v4-state-contract.mjs';
import {applyDay20V4GameChoice,applyDay20V4GameResolution,completeDay20V4GameChapter,getDay20V4GameSegment,prepareDay20V4GameEntry} from '../src/day20-v4-game-bridge.mjs?v=1';
import {getDay20V4RuntimeResolution} from '../src/day20-v4-runtime-resolution.mjs?v=1';
import {getDay21V4Options} from '../src/day21-v4-state-contract.mjs';
import {applyDay21V4GameChoice,applyDay21V4GameResolution,completeDay21V4GameChapter,getDay21V4GameSegment,prepareDay21V4GameEntry} from '../src/day21-v4-game-bridge.mjs?v=1';
import {getDay21V4RuntimeResolution} from '../src/day21-v4-runtime-resolution.mjs?v=1';

const backupKey='day22-v4-qa-save-backup';
const keys=[SaveManager.key,SaveManager.keyForMode(GAME_MODES.MARRIAGE_30),SaveManager.keyForMode(GAME_MODES.FREE_ROMANCE)];
function backup(){if(sessionStorage.getItem(backupKey)===null)sessionStorage.setItem(backupKey,JSON.stringify(Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]))));}
function optionEnding(chapter,suffix){const option=getDay21V4Options(chapter).find(item=>item.id.endsWith(`_${suffix}`));if(!option)throw new Error(`DAY21_QA_OPTION_MISSING:${chapter.phase}:${suffix}`);return option.id;}
function seedDay22(route){
  const unavailable=route==='no-travel-unavailable',difficult=route==='seoul-photo-reject',shared=!unavailable,stay=shared,seoul=route.startsWith('seoul-'),busan=route.startsWith('busan-');
  const s=createInitialState(createGirlfriendFromProfile('haeun',()=>.5),()=>.5,{mode:GAME_MODES.MARRIAGE_30});
  s.day=18;s.money=240000;s.phase=0;s.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};
  Object.assign(s.storyFlags,{day17V4Completed:true,day17V4Day18HookPending:true,day17V4TomorrowPlan:shared?'HAEUN':'SOLO',day17V4Choice9:shared?'day17_v4_life_haeun':'day17_v4_life_solo',day17V4DinnerAgreement:{day:18,partner:shared?'HAEUN':'SOLO',status:'ACCEPTED',sourceChoiceId:shared?'day17_v4_life_haeun':'day17_v4_life_solo'},day16V4YuriEncountered:false,day16V4YuriContact:'ENDED_HERE',day16V4YuriInvitation:'NONE'});
  beginDay18V4(s,unavailable?{haeunContactAllowed:false}:difficult?{otherInterest:true}:{});
  const day18Choices=unavailable?['morning_solo','menu_familiar','solo_food','return_home','alone_stop','travel_life']:difficult?['morning_keep','disclose_together','menu_each','topic_other','night_good','future_continue','travel_busan']:['morning_keep','disclose_together','menu_each','topic_good','close_home','night_good','calm_trip','travel_near'];
  for(const id of day18Choices)applyDay18V4Choice(s,`day18_v4_${id}`);
  completeDay18V4GameChapter(s,{type:'chapterCompletionCue',day:18,finalSceneReached:true});
  s.day=19;s.pendingStoryId='m30-day19-current-shared-chore';prepareDay19V4GameEntry(s);
  while(s.storyFlags.day19V4.phase!=='ending'){const c=s.storyFlags.day19V4,o=getDay19V4Options(c),selected=shared&&c.phase==='dinner'?o.find(item=>item.id.endsWith('_tomorrow_home')):o[0];applyDay19V4GameChoice(s,selected.id);}
  completeDay19V4GameChapter(s,{type:'chapterCompletionCue',day:19,finalSceneReached:true});
  s.day=20;s.pendingStoryId='m30-day20-current-shared-meal';prepareDay20V4GameEntry(s);
  while(s.storyFlags.day20V4.phase!=='ending'){
    const c=s.storyFlags.day20V4,segment=getDay20V4GameSegment(s),resolution=segment.find(step=>step.type==='haeunContactResolution'||step.type==='haeunStayResolution');
    if(resolution){applyDay20V4GameResolution(s,getDay20V4RuntimeResolution(c,resolution));continue;}
    const options=getDay20V4Options(c);let selected=options[0];
    if(stay&&c.phase==='extension')selected=options.find(item=>item.id.endsWith('_stay_longer'));
    if(c.phase==='closeness')selected=options.find(item=>item.id.endsWith('_current_distance'));
    if(stay&&c.phase==='next_evening')selected=options.find(item=>item.id.endsWith('_another_evening'));
    if(c.phase==='night_end')selected=options.find(item=>item.id.endsWith(stay?'_offer_stay':'_end_here'));
    applyDay20V4GameChoice(s,selected.id);
  }
  completeDay20V4GameChapter(s,getDay20V4GameSegment(s).at(-1));
  s.day=21;s.pendingStoryId='m30-day21-current-full-workday';
  if(busan)s.storyFlags.day21V4TravelQuote={quoteId:`qa-day22-${route}`,playerCost:60000,dateConfirmed:true,transportConfirmed:true,budgetConfirmed:true,lodgingConfirmed:true,mutualConsent:true};
  prepareDay21V4GameEntry(s);
  while(s.storyFlags.day21V4.phase!=='ending'){
    const c=s.storyFlags.day21V4,segment=getDay21V4GameSegment(s),resolution=segment.find(step=>['contactConsentCue','lodgingConsentCue','travelConfirmationCue'].includes(step.type));
    if(resolution){applyDay21V4GameResolution(s,getDay21V4RuntimeResolution(s,resolution));continue;}
    const suffix=unavailable?null:{venue:seoul?'phone':'park',contact:seoul||route==='no-travel-contact'?'walk_apart':'hug',dinner:'talk_travel',travel:seoul?'seoul':route==='no-travel-contact'?'rest_separately':'busan',lodging:['busan-shared','busan-contact-reject'].includes(route)?'shared_room_wish':'separate_spaces'}[c.phase];
    applyDay21V4GameChoice(s,suffix?optionEnding(c,suffix):getDay21V4Options(c)[0].id);
  }
  completeDay21V4GameChapter(s,{type:'chapterCompletionCue',day:21,finalSceneReached:true});
  s.day=22;s.pendingStoryId='m30-day22-current-recovery-day';return s;
}
document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{backup();const route=button.dataset.route,state=seedDay22(route);SaveManager.save(state);location.href=`../index.html?qa=day22-v4&route=${route}`;}));
document.querySelector('#inspect').addEventListener('click',()=>{const raw=localStorage.getItem(SaveManager.keyForMode(GAME_MODES.MARRIAGE_30)),saved=raw?JSON.parse(raw):null,error=saved?.eventRuntime?.lastError,facts=saved?.storyFlags?.day22V4?.facts;document.querySelector('#status').textContent=JSON.stringify({error:error??null,sharedPhotoKept:facts?.sharedPhotoKept??null,sharedPhotoDeleted:facts?.sharedPhotoDeleted??null,todayContact:facts?.todayContact??null,complete:saved?.storyFlags?.day22V4?.complete??false,day:saved?.day??null});});
document.querySelector('#restore').addEventListener('click',()=>{const data=sessionStorage.getItem(backupKey);if(data===null){document.querySelector('#status').textContent='이 탭에 백업이 없습니다.';return;}for(const [key,value] of Object.entries(JSON.parse(data)))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector('#status').textContent='테스트 전 저장을 복원했습니다.';});
</script></html>
