<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAY 8 V3 Browser QA</title>
<style>body{margin:0;background:#121019;color:#fff;font:15px system-ui}main{max-width:1120px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.shot{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#080910}.shot img{width:100%;height:100%;object-fit:contain}.hud,.dialogue{position:absolute;left:0;right:0;background:#151322cc;padding:7px 12px}.hud{top:0}.dialogue{bottom:0}.shot b{position:absolute;left:12px;top:45px;text-shadow:0 2px 5px #000}button{margin:18px 0;padding:13px 20px;border:0;border-radius:10px;background:#df5f91;color:white;font-weight:800}pre{white-space:pre-wrap;background:#24202d;padding:14px;border-radius:12px}.pass{color:#7ce5ae}@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:1fr}.shot{aspect-ratio:16/9}}</style></head>
<body><main><h1>DAY 8 V3 Browser QA</h1><p>실제 V3 에셋·경로 모듈 / HUD·대화창 안전 영역</p><div class="grid" id="grid"></div><button id="run">RUN ROUTE BOUNDARIES</button><pre id="result">대기</pre></main>
<script type="module">
import {DAY8_V3_EVENT_CG_ASSETS,getDay8V3EventCg} from "../src/day8-v3-event-assets.mjs";
const labels={overfilledWaterGlass:"S05 물컵 행동",movingDayPhotoPhone:"S06 이사 사진 POV",publicCreditPhone:"S12 공개 크레딧 POV",liveHouseOffbeatClap:"S15 공연 엇박수",cafeNapkinDrawing:"S15 카페 냅킨",existingClothesPhotoPhone:"S24 기존 옷 두 색 POV"};
const grid=document.querySelector("#grid");for(const [key,src] of Object.entries(DAY8_V3_EVENT_CG_ASSETS))grid.insertAdjacentHTML("beforeend",`<article class="shot"><img src="../${src}" alt="${labels[key]}"><span class="hud">DAY 8 · STORY</span><b>${labels[key]}</b><span class="dialogue">핵심 얼굴·손·소품이 HUD와 대화창 사이에 남아야 합니다.</span></article>`);
document.querySelector("#run").addEventListener("click",()=>{const photo={storyFlags:{day8V3JihoonPreparation:"prepare-one-photo",day8V3PhotoRequested:true}},live={storyFlags:{day8V3AfternoonRoute:"LIVE_HOUSE"}},cafe={storyFlags:{day8V3AfternoonRoute:"CAFE"}},home={storyFlags:{day8V3AfternoonRoute:"HOME"}},rest={storyFlags:{day8V3RestBoundary:true}};const checks=[getDay8V3EventCg(6,photo)?.includes("moving-day"),getDay8V3EventCg(15,live)?.includes("live-house"),getDay8V3EventCg(15,cafe)?.includes("cafe"),getDay8V3EventCg(15,home)===null,getDay8V3EventCg(24,rest)===null,getDay8V3EventCg(24,{storyFlags:{}})?.includes("existing-clothes")];const pass=checks.every(Boolean)&&document.querySelectorAll("img").length===6;const out=document.querySelector("#result");out.className=pass?"pass":"";out.textContent=`${pass?"PASS":"FAIL"}\nPHOTO ${checks[0]}\nLIVE_ONLY ${checks[1]}\nCAFE_ONLY ${checks[2]}\nHOME_NO_CG ${checks[3]}\nREST_NO_NIGHT_CG ${checks[4]}\nNORMAL_DAY9_HOOK ${checks[5]}`;});
</script></body></html>
