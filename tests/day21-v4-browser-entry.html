<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<h1>DAY21 V4 실제 게임 QA</h1>
<p>검증된 DAY18→19→20 실제 reducer와 bridge를 완주해 DAY21 시작 상태를 만듭니다. 버튼은 시작 상태만 준비하며 DAY21은 실제 게임 화면에서 SKIP 없이 선택합니다. 최초 실행 전 저장 키를 세션에 한 번 백업합니다.</p>
<button data-route="park">Park · 공원 대화</button><button data-route="phone">Phone · 통화</button><button data-route="deferred">Deferred · 무연락 연기</button><button data-route="busan">Busan · 검증 견적</button><button data-route="seoul">Seoul · 당일</button><button data-route="rest">Rest · 각자 쉬기</button><button id="restore">테스트 전 저장 복원</button><p role="status" id="status"></p>
<script type="module">
import {createInitialState} from '../src/game-core.mjs';import {createGirlfriendFromProfile} from '../src/girlfriend-manager.mjs';import {SaveManager} from '../src/save-manager.mjs';import {GAME_MODES} from '../src/scenario-state.mjs';
import {beginDay18V4,applyDay18V4Choice} from '../src/day18-v4-state-contract.mjs';import {completeDay18V4GameChapter} from '../src/day18-v4-game-bridge.mjs?v=62';
import {getDay19V4Options} from '../src/day19-v4-state-contract.mjs';import {applyDay19V4GameChoice,completeDay19V4GameChapter,prepareDay19V4GameEntry} from '../src/day19-v4-game-bridge.mjs?v=4';
import {getDay20V4Options} from '../src/day20-v4-state-contract.mjs';import {applyDay20V4GameChoice,applyDay20V4GameResolution,completeDay20V4GameChapter,getDay20V4GameSegment,prepareDay20V4GameEntry} from '../src/day20-v4-game-bridge.mjs?v=1';import {getDay20V4RuntimeResolution} from '../src/day20-v4-runtime-resolution.mjs?v=1';
const backupKey='day21-v4-qa-save-backup',keys=[SaveManager.key,SaveManager.keyForMode(GAME_MODES.MARRIAGE_30),SaveManager.keyForMode(GAME_MODES.FREE_ROMANCE)];
function backup(){if(sessionStorage.getItem(backupKey)===null)sessionStorage.setItem(backupKey,JSON.stringify(Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]))));}
function seed(route){const shared=route!=='deferred',stay=['park','busan','rest'].includes(route),s=createInitialState(createGirlfriendFromProfile('haeun',()=>.5),()=>.5,{mode:GAME_MODES.MARRIAGE_30});s.day=18;s.money=240000;s.phase=0;s.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};Object.assign(s.storyFlags,{day17V4Completed:true,day17V4Day18HookPending:true,day17V4TomorrowPlan:shared?'HAEUN':'SOLO',day17V4Choice9:shared?'day17_v4_life_haeun':'day17_v4_life_solo',day17V4DinnerAgreement:{day:18,partner:shared?'HAEUN':'SOLO',status:'ACCEPTED',sourceChoiceId:shared?'day17_v4_life_haeun':'day17_v4_life_solo'},day16V4YuriEncountered:false,day16V4YuriContact:'ENDED_HERE',day16V4YuriInvitation:'NONE'});beginDay18V4(s,shared?{}:{haeunContactAllowed:false});for(const id of shared?['morning_keep','disclose_together','menu_each','topic_good','close_home','night_good','calm_trip','travel_near']:['morning_solo','menu_familiar','solo_food','return_home','alone_stop','travel_life'])applyDay18V4Choice(s,`day18_v4_${id}`);completeDay18V4GameChapter(s,{type:'chapterCompletionCue',day:18,finalSceneReached:true});s.day=19;s.pendingStoryId='m30-day19-current-shared-chore';prepareDay19V4GameEntry(s);while(s.storyFlags.day19V4.phase!=='ending'){const p=s.storyFlags.day19V4.phase,o=getDay19V4Options(s.storyFlags.day19V4),i=shared&&p==='dinner'?o.findIndex(x=>x.id.endsWith('_tomorrow_home')):0;applyDay19V4GameChoice(s,o[Math.max(0,i)].id);}completeDay19V4GameChapter(s,{type:'chapterCompletionCue',day:19,finalSceneReached:true});s.day=20;s.pendingStoryId='m30-day20-current-shared-meal';prepareDay20V4GameEntry(s);while(s.storyFlags.day20V4.phase!=='ending'){const c=s.storyFlags.day20V4,segment=getDay20V4GameSegment(s),resolution=segment.find(x=>x.type==='haeunContactResolution'||x.type==='haeunStayResolution');if(resolution){applyDay20V4GameResolution(s,getDay20V4RuntimeResolution(c,resolution));continue;}const o=getDay20V4Options(c);let selected=o[0];if(stay&&c.phase==='extension')selected=o.find(x=>x.id.endsWith('_stay_longer'));if(c.phase==='closeness')selected=o.find(x=>x.id.endsWith('_current_distance'));if(stay&&c.phase==='next_evening')selected=o.find(x=>x.id.endsWith('_another_evening'));if(c.phase==='night_end')selected=o.find(x=>x.id.endsWith(stay?'_offer_stay':'_end_here'));applyDay20V4GameChoice(s,selected.id);}completeDay20V4GameChapter(s,getDay20V4GameSegment(s).at(-1));s.day=21;s.pendingStoryId='m30-day21-current-full-workday';if(route==='busan')s.storyFlags.day21V4TravelQuote={quoteId:'qa-day21-busan',playerCost:60000,dateConfirmed:true,transportConfirmed:true,budgetConfirmed:true,lodgingConfirmed:true,mutualConsent:true};return s;}
document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{backup();SaveManager.save(seed(button.dataset.route));location.href=`../index.html?qa=day21-v4&route=${button.dataset.route}`;}));document.querySelector('#restore').addEventListener('click',()=>{const data=sessionStorage.getItem(backupKey);if(data===null){document.querySelector('#status').textContent='이 탭에 백업이 없습니다.';return;}for(const [key,value] of Object.entries(JSON.parse(data)))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector('#status').textContent='테스트 전 저장을 복원했습니다.';});
</script></html>
