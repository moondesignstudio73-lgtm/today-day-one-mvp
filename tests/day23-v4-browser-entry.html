<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAY23 V4 실제 게임 QA</title>
<style>body{font:18px system-ui;background:#181522;color:#fff;padding:40px}button{padding:16px;margin:8px}p{max-width:900px;line-height:1.6}</style>
<h1>DAY23 V4 실제 게임 QA</h1>
<p>검증된 DAY22 완료 fixture에서 DAY23 실제 게임 화면을 엽니다. 본편의 모든 장면과 선택은 SKIP 없이 진행합니다. 최초 실행 전 저장 키를 이 탭의 세션에 한 번 백업합니다.</p>
<button data-route="busan-shared">Friendly · 부산 공유 숙소</button>
<button data-route="busan-separate">Neutral · 부산 별실</button>
<button data-route="seoul-day">Mixed · 서울 당일</button>
<button data-route="no-travel-contact">Neutral · 미여행 · 연락 가능</button>
<button data-route="no-travel-unavailable">Distant · 미여행 · 연락 불가</button>
<button id="inspect">현재 QA 상태 확인</button>
<button id="restore">테스트 전 저장 복원</button>
<p role="status" id="status"></p>
<script type="module">
import {SaveManager} from '../src/save-manager.mjs';
import {GAME_MODES} from '../src/scenario-state.mjs';
import {createInitialState} from '../src/game-core.mjs';
import {createGirlfriendFromProfile} from '../src/girlfriend-manager.mjs';
import {DAY21_V4_SCHEMA,applyDay21V4Choice,completeDay21V4,getDay21V4Options,resolveDay21V4Contact,resolveDay21V4Lodging,resolveDay21V4Travel} from '../src/day21-v4-state-contract.mjs';
import {applyDay22V4Choice,beginDay22V4,completeDay22V4,getDay22V4Options,resolveDay22V4Contact,resolveDay22V4Photo} from '../src/day22-v4-state-contract.mjs';

const backupKey='day23-v4-qa-save-backup';
const keys=[SaveManager.key,SaveManager.keyForMode(GAME_MODES.MARRIAGE_30),SaveManager.keyForMode(GAME_MODES.FREE_ROMANCE)];
function backup(){if(sessionStorage.getItem(backupKey)===null)sessionStorage.setItem(backupKey,JSON.stringify(Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]))));}
function choose(options,suffix,label){const selected=suffix?options.find(option=>option.id.endsWith(`_${suffix}`)):options[0];if(!selected)throw new Error(`${label}:${suffix}`);return selected.id;}
function completedDay22(route,{shared=true,contactAvailableNoTravel=false}={}){
  const unavailable=route==='NO_TRAVEL',state=createInitialState(createGirlfriendFromProfile('haeun',()=>.5),()=>.5,{mode:GAME_MODES.MARRIAGE_30});
  state.day=21;state.money=240000;state.phase=0;state.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};
  const input={relationshipActive:!unavailable,contactAllowed:!unavailable,relationshipTone:unavailable?'DIFFICULT':'CALM',morningMode:unavailable?'SOLO_MORNING':'STAYED_MORNING',day20VisitMode:unavailable?'SOLO':'FACE_TO_FACE',day20StayedOver:!unavailable,day20SleepingPlan:unavailable?null:'SEPARATE_BEDDING',day20CupChoice:unavailable?null:'FITS_HAND',day20BorrowedClothes:false,day20FirstHug:false,day20HeldHands:false,day20SatSideBySide:!unavailable,day20EveningExtension:unavailable?null:'STAY_LONGER',day20NextInvitation:unavailable?null:'OPEN',day20DisclosureRoute:'NONE',day20NightEnd:unavailable?'LEFT':'STAYED',day19TravelCandidate:'BUSAN_NIGHT',day19ReservationStatus:'CANDIDATE_ONLY',day19BudgetMode:'SPLIT',day19ScheduleTrim:'LIGHT',day19PendingContacts:[],day19ContactHandling:'DONE',day19MinhoReply:null,source:{day20Schema:'day20-notion-v4/1',day20Choice13:'day20_v4_c13_x',day20Choice14:'day20_v4_c14_x'}};
  state.storyFlags.day21V4={schema:DAY21_V4_SCHEMA,input,choices:[],phase:'morning',complete:false,facts:{morningChoice:null,breakfastChoice:null,conversationMode:null,conversationAccepted:false,heardHaeunStory:false,heardLunchStory:false,heardWorkStory:false,heardAngerStory:false,heardSocksStory:false,listeningApproach:null,afternoonResponse:null,stayingResponse:null,storyContinuation:null,feelingStatement:null,opennessPlan:null,contactIntent:null,todayContact:null,dinnerPlan:null,travelDiscussion:false,travelIntent:null,travelResult:null,lodgingRequest:null,lodgingAgreement:null,travelChecks:null,bookingConfirmed:false,travelPaymentMade:false,preparationPlan:null,bagPlan:null,finalMessage:null,deferredReflection:null,deferredExplanation:null,deferredTomorrow:null,deferredTask:null,deferredGoodnight:null}};
  while(state.storyFlags.day21V4.phase!=='ending'){
    const chapter=state.storyFlags.day21V4,phase=chapter.phase;
    if(phase==='contact_resolution'){resolveDay21V4Contact(state,{type:'haeunContactResponse',contact:chapter.facts.contactIntent,accepted:true});continue;}
    if(phase==='lodging_resolution'){resolveDay21V4Lodging(state,{type:'haeunLodgingResponse',accepted:shared});continue;}
    if(phase==='travel_resolution'){resolveDay21V4Travel(state,{type:'travelConfirmation',confirmed:true,dateConfirmed:true,transportConfirmed:true,budgetConfirmed:true,lodgingConfirmed:true,mutualConsent:true});continue;}
    const suffix={venue:unavailable?'defer':route==='SEOUL_DAY'?'phone':'park',contact:'hug',dinner:'talk_travel',travel:route==='BUSAN_TRIP'?'busan':route==='SEOUL_DAY'?'seoul':'rest_separately',lodging:route==='BUSAN_TRIP'?(shared?'shared_room_wish':'separate_spaces'):route==='SEOUL_DAY'?'day_trip':'separate_spaces'}[phase];
    applyDay21V4Choice(state,choose(getDay21V4Options(chapter),suffix,`DAY21:${phase}`));
  }
  completeDay21V4(state,{type:'chapterCompletionCue',day:21,finalSceneReached:true});
  if(route==='BUSAN_TRIP')state.storyFlags.day21V4TravelPurchase={day:21,quoteId:'day23-browser-qa',playerCost:60000,partnerCostIncluded:false,ledgerIndex:0};
  if(unavailable&&contactAvailableNoTravel){state.breakup=null;state.ended=false;state.storyFlags.day21V4.input.relationshipActive=true;state.storyFlags.day21V4.input.contactAllowed=true;}
  state.day=22;beginDay22V4(state);
  while(state.storyFlags.day22V4.phase!=='ending'){
    const chapter=state.storyFlags.day22V4;
    if(chapter.phase==='photo_resolution'){resolveDay22V4Photo(state,{type:'haeunPhotoResponse',keepAccepted:true});continue;}
    if(chapter.phase==='contact_resolution'){resolveDay22V4Contact(state,{type:'haeunContactResponse',contact:chapter.facts.contactIntent,accepted:true});continue;}
    applyDay22V4Choice(state,getDay22V4Options(chapter)[0].id);
  }
  completeDay22V4(state,{type:'chapterCompletionCue',day:22,finalSceneReached:true});return state;
}
function seed(route){
  const unavailable=route==='no-travel-unavailable',noTravel=route.startsWith('no-travel'),separate=route==='busan-separate';
  const state=completedDay22(noTravel?'NO_TRAVEL':route==='seoul-day'?'SEOUL_DAY':'BUSAN_TRIP',{shared:!separate,contactAvailableNoTravel:noTravel&&!unavailable});
  state.day=23;state.phase=0;state.money=Math.max(state.money,100000);state.pendingStoryId='m30-day23-current-family-contact';
  state.settings.guideCompleted={main:true,atlas:true,district:true,room:true,map:true};
  return state;
}
document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{backup();const route=button.dataset.route,state=seed(route);SaveManager.save(state);location.href=`../index.html?qa=day23-v4&route=${route}`;}));
document.querySelector('#inspect').addEventListener('click',()=>{const raw=localStorage.getItem(SaveManager.keyForMode(GAME_MODES.MARRIAGE_30)),saved=raw?JSON.parse(raw):null,chapter=saved?.storyFlags?.day23V4,error=saved?.eventRuntime?.lastError;document.querySelector('#status').textContent=JSON.stringify({error:error??null,route:chapter?.input?.route??null,phase:chapter?.phase??null,complete:chapter?.complete??false,day:saved?.day??null,money:saved?.money??null,pendingStoryId:saved?.pendingStoryId??null,day24Hook:saved?.storyFlags?.day23V4Day24HookPending??false,freeAction:saved?.storyFreeAction??null});});
document.querySelector('#restore').addEventListener('click',()=>{const data=sessionStorage.getItem(backupKey);if(data===null){document.querySelector('#status').textContent='이 탭에 백업이 없습니다.';return;}for(const [key,value] of Object.entries(JSON.parse(data)))value===null?localStorage.removeItem(key):localStorage.setItem(key,value);sessionStorage.removeItem(backupKey);document.querySelector('#status').textContent='테스트 전 저장을 복원했습니다.';});
</script></html>
