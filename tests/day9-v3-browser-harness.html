<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAY 9 V3 Browser QA</title>
<style>
body{margin:0;background:#111019;color:#fff;font:15px system-ui}main{max-width:1180px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.shot{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#080910}.shot img{width:100%;height:100%;object-fit:contain}.hud,.dialogue{position:absolute;z-index:3;left:0;right:0;background:#151322d9;padding:7px 12px}.hud{top:0}.dialogue{bottom:0}.shot b{position:absolute;z-index:3;left:12px;top:45px;text-shadow:0 2px 5px #000}.sprite-stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#090a12}.sprite-stage .bg{width:100%;height:100%;object-fit:cover}.sprite-stage .sprite{position:absolute;z-index:2;left:50%;bottom:7%;width:auto;height:86%;transform:translateX(-50%);object-fit:contain}.sprite-stage .safe{position:absolute;z-index:4;inset:10% 20%;border:2px dashed #75e6ad88;pointer-events:none}button{margin:18px 0;padding:13px 20px;border:0;border-radius:10px;background:#df5f91;color:white;font-weight:800}pre{white-space:pre-wrap;background:#24202d;padding:14px;border-radius:12px}.pass{color:#7ce5ae}@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:1fr}.sprite-stage .sprite{height:82%}.sprite-stage .safe{inset:10% 20%}}
</style></head>
<body><main><h1>DAY 9 V3 Browser QA</h1><p>신규 하은 투명 RGBA · 행동 CG 8종 · HUD/대화창 및 모바일 center-60 안전 영역</p>
<section class="sprite-stage"><img class="bg" id="mall" alt="쇼핑몰 배경"><img class="sprite" id="haeun" alt="DAY 9 하은"><span class="hud">DAY 9 · STORY</span><b>하은 스프라이트 합성</b><span class="dialogue">얼굴·손·신발이 UI와 겹치지 않고 배경 위에 자연스럽게 합성되어야 합니다.</span><i class="safe"></i></section>
<div class="grid" id="grid"></div><button id="run">RUN IMAGE QA</button><pre id="result">대기</pre></main>
<script type="module">
import {DAY9_V3_PLANNED_ASSETS,DAY9_V3_READY_BACKGROUNDS,validateDay9V3PresentationAudit} from "../src/day9-v3-presentation-data.mjs";
const labels={hangerChoice:"두 옷걸이 선택 POV",pinkFit:"분홍 셔츠 불편",greenFit:"초록 셔츠 주머니",scarfReceipt:"스카프 영수증 POV",scarfBoundary:"스카프 경계 선택",playerSleeve:"플레이어 소매 피팅",restZipper:"벤치 지퍼 휴식",checkout:"교환·영수증 POV"};
document.querySelector("#mall").src=`../${DAY9_V3_READY_BACKGROUNDS.mall}`;document.querySelector("#haeun").src=`../${DAY9_V3_PLANNED_ASSETS.haeun}`;
const grid=document.querySelector("#grid");for(const [key,label] of Object.entries(labels)){const src=DAY9_V3_PLANNED_ASSETS[key];grid.insertAdjacentHTML("beforeend",`<article class="shot"><img src="../${src}" alt="${label}"><span class="hud">DAY 9 · STORY</span><b>${label}</b><span class="dialogue">핵심 얼굴·손·소품이 HUD와 대화창 사이에 남아야 합니다.</span></article>`)}
document.querySelector("#run").addEventListener("click",()=>{const images=[...document.images];const loaded=images.every(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0);const wide=[...grid.querySelectorAll("img")].every(img=>Math.abs(img.naturalWidth/img.naturalHeight-16/9)<0.02);const sprite=document.querySelector("#haeun");const portrait=sprite.naturalHeight>sprite.naturalWidth;const pass=loaded&&wide&&portrait&&validateDay9V3PresentationAudit();const out=document.querySelector("#result");out.className=pass?"pass":"";out.textContent=`${pass?"PASS":"FAIL"}\nIMAGES ${images.length}/10 loaded ${loaded}\nEVENT_CG 8/8 wide ${wide}\nHAEUN ${sprite.naturalWidth}x${sprite.naturalHeight} portrait ${portrait}\nPRESENTATION_AUDIT ${validateDay9V3PresentationAudit()}`});
</script></body></html>
